<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mr. Bartholomew Fishington's Ocean Cleanup</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#021427; }
  #viewport {width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #stage {position: relative; width: 1920px; height: 1080px; flex: 0 0 1920; flex-shrink: 0; transform-origin: center center; overflow: hidden; cursor: pointer;
}
  .layer { position:absolute; top:0; left:0; width:1920px; height:1080px; pointer-events:none; z-index:1; }
  .sprite { position:absolute; user-select:none; -webkit-user-drag:none; pointer-events:auto; z-index:1; }

  .menubar { position:absolute; top:0; left:0; width:1920px; height:95px; z-index:500; pointer-events:none; background:#021427; }
  /* only the shell icon + "Menu" text area on the left opens the dropdown, not the whole bar */
  .menubutton { position:absolute; top:0; left:0; width:280px; height:95px; z-index:505; cursor:pointer; pointer-events:auto; }
  .menudropdown { position:absolute; top:0; left:0; width:1920px; height:1080px; z-index:600; }
  /* positions measured off menu_drop_down.svg */
  .hotspot { position:absolute; width:364px; height:78px; cursor:pointer; left:29px; }
  .hotspot-home   { top:110px; }
  .hotspot-game   { top:213px; }
  .hotspot-credit { top:316px; }

  #hud { position:absolute; top:0; left:0; width:1920px; height:95px; z-index:510; display:none; pointer-events:none; }
  .navlabel {
    position:absolute; top:14px; right:40px; z-index:510; pointer-events:none;
    font-family:'Apotek Wide','Apotek','Alata',Arial,sans-serif; font-weight:900; font-size:48px; color:#EBFBE9; display:none;
  }
  .hudhearts { position:absolute; top:30px; right:40px; display:flex; gap:8px; }
  .hudtimer {
    position:absolute; top:10px; right:260px;
    font-family:'Apotek','Alata',Arial,sans-serif; font-weight:700; font-size:48px;
    color:#EBFBE9; line-height:60px;
  }
  .clicktocontinue {
    position:absolute; left:50%; bottom:40px; transform:translateX(-50%);
    font-family:'Alata',Arial,sans-serif; font-size:32px; color:#EBFBE9; z-index:2;
  }

  /* above every other layer, but under the menu bar/button and the dropdown */
  .warninglayer { position:absolute; top:0; left:0; width:1920px; height:1080px; z-index:490; pointer-events:none; display:none; }

  .creditwrap { position:absolute; top:95px; left:0; width:1920px; height:985px; overflow-y:auto; overflow-x:hidden; z-index:700; background:#021427; -webkit-overflow-scrolling:touch; }
  .creditimg { display:block; width:1920px; height:auto; }

  #loading {
    position:absolute; top:0; left:0; width:100%; height:100%; z-index:999;
    align-items:center; justify-content:center; background:#021423;
    font-family:'Alata', Arial,sans-serif; font-weight:700; font-size:40px; color:#cfe9ff;
  }
  img { display:block; }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="hud">
      <div id="hudHearts" class="hudhearts"></div>
      <div id="hudTimer" class="hudtimer">30</div>
    </div>
    <img id="menuBar" class="menubar" style="display:none;">
    <div id="menuButton" class="menubutton" title="Menu"></div>
    <div id="navLabel" class="navlabel">Home</div>
    <div id="menuDropdown" class="menudropdown" style="display:none;">
      <img id="menuDropdownImg" class="layer">
      <div id="homeHotspot" class="hotspot hotspot-home" title="Home"></div>
      <div id="gameHotspot" class="hotspot hotspot-game" title="Game"></div>
      <div id="creditHotspot" class="hotspot hotspot-credit" title="Credit"></div>
    </div>
    <div id="loading">Loading...</div>
  </div>
</div>

<script>
const STAGE_W = 1920, STAGE_H = 1080;
// nothing free-roaming (win fish, lose-scene floating trash) goes above this line
const MENU_BAR_HEIGHT = 95;
const IMG = 'images/';
const SOUND = 'sound/';
const sounds = {
  bubbling: new Audio(SOUND + 'bubbling-sound.wav'),
  clicking: new Audio(SOUND + 'clicking.wav'),
  clickingTrash: new Audio(SOUND + 'clicking-trash.wav'),
  wrong: new Audio(SOUND + 'wrong.wav'),
  youWin: new Audio(SOUND + 'you-win.wav'),
  youLose: new Audio(SOUND + 'you-lose.wav')
};
sounds.bubbling.loop = false;
sounds.youWin.loop = false;
sounds.youLose.loop = false;

// ---------------- background music ----------------
let audioCtx = null;
let musicGain = null;

function setupAudioGraph(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  musicGain = audioCtx.createGain();
  musicGain.gain.value = 0.12;
  musicGain.connect(audioCtx.destination);
}

function playNote(freq, time, dur){
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(1, time+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, time+dur);
  osc.connect(g).connect(musicGain);
  osc.start(time);
  osc.stop(time+dur+0.05);
}
const MUSIC_NOTES = [261.63,329.63,392.00,329.63,440.00,392.00,329.63,293.66];
let musicStarted = false, musicActive = false;
function scheduleMusicLoop(){
  if(!musicActive) return;
  const noteDur = 0.28;
  const startAt = audioCtx.currentTime + 0.05;
  MUSIC_NOTES.forEach((freq,i)=> playNote(freq, startAt + i*noteDur, noteDur*0.85));
  setTimeout(scheduleMusicLoop, MUSIC_NOTES.length*noteDur*1000);
}
function startBackgroundMusic(){
  if(!audioCtx || musicStarted) return;
  musicStarted = true;
  musicActive = true;
  scheduleMusicLoop();
}
function stopBackgroundMusic(){ musicActive = false; }
function resumeBackgroundMusic(){
  if(!audioCtx || !musicStarted || musicActive) return;
  musicActive = true;
  scheduleMusicLoop();
}

function playSound(sound, name){
  sound.volume = 1;
  sound.currentTime = 0;
  sound.play().catch(err => {
    console.warn(`Could not play sound [${name || '?'}]:`, sound.src, err);
  });
}
function stopSound(sound){
  sound.pause();
  sound.currentTime = 0;
}

let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  setupAudioGraph();
  audioCtx.resume().then(()=>{
    if(sounds.bubbling.paused) playSound(sounds.bubbling, 'bubbling');
    startBackgroundMusic();
  }).catch(err=> console.warn('AudioContext failed to resume:', err));
}
document.getElementById('stage').addEventListener('click', ()=>{
  if(audioCtx && audioCtx.state !== 'running') audioCtx.resume().catch(()=>{});
}, true);

// ---------------- global pause (menu bar) ----------------
let paused = false;
let currentScene = 'start';

const RANDOMIZE_BOX = { left:716, top:456, w:470, h:298 };
const FISH_SPEED = 110;
const FISH_DEAD = 'fish_dead.png';
const MAX_MISSES = 5;

const FISH_COUNT = 18, TRASH_COUNT = 21, WARNING_COUNT = 13;
const fishNames  = Array.from({length:FISH_COUNT},  (_,i)=>`fish_${String(i+1).padStart(2,'0')}.png`);
const trashNames = Array.from({length:TRASH_COUNT}, (_,i)=>`trash_${String(i+1).padStart(2,'0')}.png`);
const warningNames = Array.from({length:WARNING_COUNT}, (_,i)=>`warnings_${String(i+1).padStart(2,'0')}.png`);

const SWIM_BOX = { left:360, right:STAGE_W-360, top:STAGE_H/2, bottom:STAGE_H-70 };
const CORAL_RECTS = [
  { x:0, y:STAGE_H-436, w:360, h:436 },
  { x:STAGE_W-360, y:STAGE_H-436, w:360, h:436 }
];

function overlapsCoral(x,y,w,h){
  return CORAL_RECTS.some(r=> x<r.x+r.w && x+w>r.x && y<r.y+r.h && y+h>r.y);
}
function rectOverlap(x,y,w,h,f){
  return x<f.x+f.w && x+w>f.x && y<f.y+f.h && y+h>f.y;
}
function fitBox(nw, nh, bw, bh){
  const scale = Math.min(bw/nw, bh/nh);
  return { w: nw*scale, h: nh*scale };
}
function rotatedBox(w, h, angleDeg){
  const r = angleDeg*Math.PI/180;
  const bbW = Math.abs(w*Math.cos(r)) + Math.abs(h*Math.sin(r));
  const bbH = Math.abs(w*Math.sin(r)) + Math.abs(h*Math.cos(r));
  return { bbW, bbH };
}
function rotatedXBounds(w, bbW){
  return { minX:(bbW-w)/2, maxX:STAGE_W - w/2 - bbW/2 };
}
function rotatedYBounds(h, bbH){
  return { minY:(bbH-h)/2, maxY:STAGE_H - h/2 - bbH/2 };
}
const randRange = (a,b)=> a + Math.random()*(b-a);

// ---------------- stage helpers ----------------
const stage = document.getElementById('stage');
const hud = document.getElementById('hud');
const hudHearts = document.getElementById('hudHearts');
const hudTimer = document.getElementById('hudTimer');
const menuBar = document.getElementById('menuBar');
const menuButton = document.getElementById('menuButton');
const navLabel = document.getElementById('navLabel');
const menuDropdown = document.getElementById('menuDropdown');
const menuDropdownImg = document.getElementById('menuDropdownImg');
const homeHotspot = document.getElementById('homeHotspot');
const gameHotspot = document.getElementById('gameHotspot');
const creditHotspot = document.getElementById('creditHotspot');

function fitStage(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const portrait = vw < vh;
  const scale = portrait
    ? Math.min(vw / STAGE_H, vh / STAGE_W)
    : Math.min(vw / STAGE_W, vh / STAGE_H);
  stage.style.transform = portrait
    ? `rotate(90deg) scale(${scale})`
    : `scale(${scale})`;
}
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', ()=> setTimeout(fitStage, 50));

let timers=[], intervals=[], cleanupFns=[];
function clearStage(){
  cleanupFns.forEach(fn=>{ try{ fn(); } catch(e){} });
  cleanupFns=[];
  timers.forEach(clearTimeout); timers=[];
  intervals.forEach(clearInterval); intervals=[];
  [...stage.children].forEach(c=>{ if(c!==hud && c!==navLabel && c!==menuBar && c!==menuButton && c!==menuDropdown) c.remove(); });
  hud.style.display='none';
  navLabel.style.display='none';
  stage.onclick=null;
  warningEl = null;
  clearTimeout(warningTimer);
}
// ---------------- bottom-edge warning flash ----------------
let warningEl = null, warningTimer = null;
function triggerWarning(){
  const name = warningNames[Math.floor(Math.random()*warningNames.length)];
  if(!warningEl){
    warningEl = document.createElement('img');
    warningEl.className = 'warninglayer';
    stage.appendChild(warningEl);
  }
  warningEl.src = IMG+name;
  warningEl.style.display = 'block';
  clearTimeout(warningTimer);
  warningTimer = setTimeout(()=>{ if(warningEl) warningEl.style.display = 'none'; }, 1000);
  timers.push(warningTimer);
}

function makeImg(src, cls){
  const el = document.createElement('img');
  el.src = src; el.className = cls || 'sprite'; el.draggable = false;
  el.onerror = ()=> console.warn('Missing image asset (check filename/path):', src);
  stage.appendChild(el);
  return el;
}

// ---------------- menu bar / dropdown / navigation / credit ----------------
// all handlers below are bubble phase - a hotspot's own click always
// runs before this stops the event from reaching the scene underneath
let creditWrapEl = null;
let menuOpen = false;
let lastMenuClickAt = 0; // debounce so a double-fired click doesn't flip state twice

menuButton.addEventListener('click', e=>{
  const now = Date.now();
  if(now - lastMenuClickAt < 150){ e.stopPropagation(); return; }
  lastMenuClickAt = now;
  if(creditWrapEl){ closeCreditIfOpen(); openMenu(); e.stopPropagation(); return; }
  if(menuOpen) closeMenu();
  else openMenu();
  e.stopPropagation();
});
homeHotspot.addEventListener('click', e=>{ goToHome(); e.stopPropagation(); });
gameHotspot.addEventListener('click', e=>{ goToGame(); e.stopPropagation(); });
creditHotspot.addEventListener('click', e=>{ showCredit(); e.stopPropagation(); });
menuDropdown.addEventListener('click', e=>{
  if(e.target === menuDropdown || e.target === menuDropdownImg) closeMenu();
  e.stopPropagation();
});

function openMenu(){
  menuOpen = true;
  paused = currentScene !== 'home';
  menuDropdownImg.src = IMG+'menu_drop_down.png';
  menuDropdown.style.display = 'block';
}
function closeMenu(){
  menuOpen = false;
  menuDropdown.style.display = 'none';
  paused = false;
}
function closeCreditIfOpen(){
  if(creditWrapEl){ creditWrapEl.remove(); creditWrapEl = null; }
}
function goToHome(){
  menuOpen = false;
  menuDropdown.style.display = 'none';
  paused = false;
  showHome();
}
function goToGame(){
  menuOpen = false;
  menuDropdown.style.display = 'none';
  paused = false;
  showRandomize();
}
// leave credit by clicking the bar again, same as opening the menu
function showCredit(){
  menuOpen = false;
  menuDropdown.style.display = 'none';
  const wrap = document.createElement('div');
  wrap.className = 'creditwrap';
  wrap.addEventListener('click', e=> e.stopPropagation());
  const img = document.createElement('img');
  img.src = IMG+'credit.png';
  img.className = 'creditimg';
  wrap.appendChild(img);
  stage.appendChild(wrap);
  creditWrapEl = wrap;
}

// ---------------- asset preloading + synchronous size lookup ----------------
const imageCache = {};
function dims(src){
  const im = imageCache[src];
  return im ? { w: im.naturalWidth, h: im.naturalHeight } : { w:100, h:100 };
}
function preload(list){
  return Promise.all(list.map(src=> new Promise(res=>{
    const im = new Image();
    im.onload = ()=>{ imageCache[src] = im; res(true); };
    im.onerror = ()=> res(false);
    im.src = src;
  })));
}

// ---------------- 1. start screen ----------------
function showStart(){
  currentScene = 'start';
  clearStage();
  makeImg(IMG+'game_start.png','layer');
  playSound(sounds.bubbling, 'bubbling');
  stage.onclick = ()=> {
    unlockAudio();
    playSound(sounds.clicking, 'clicking');
    showHome();
  };
}

// ---------------- 1b. home screen ----------------
function showHome(){
  currentScene = 'home';
  clearStage();
  makeImg(IMG+'home.png','layer');
  menuBar.src = IMG+'menu_bar.png';
  menuBar.style.display = 'block';
  navLabel.textContent = 'Home';
  navLabel.style.display = 'block';
  startHomeAmbience();
  stage.onclick = ()=> {
    playSound(sounds.clicking, 'clicking');
    showRandomize();
  };
}
function startHomeAmbience(){
  const ref = { alive:true, last:null };
  cleanupFns.push(()=> ref.alive=false);
  const fishes = spawnAmbientFish();
  requestAnimationFrame(t=> ambientFishLoop(fishes, ref, t));
  scheduleAmbientTrash(ref);
}
function spawnAmbientFish(){
  const count = 3 + Math.floor(Math.random()*3);
  const fishes = [];
  for(let i=0;i<count;i++){
    const src = IMG + fishNames[Math.floor(Math.random()*fishNames.length)];
    fishes.push(makeAmbientFish(src, randRange(0.5, 1)));
  }
  return fishes;
}
function makeAmbientFish(src, scale){
  const el = makeImg(src);
  const d = dims(src);
  const w = d.w*scale, h = d.h*scale;
  el.style.width = w+'px'; el.style.height = h+'px';
  const x = randRange(0, STAGE_W-w), y = randRange(150, STAGE_H-h-100);
  el.style.left = x+'px'; el.style.top = y+'px';
  return { el, x, y, w, h, speed: randRange(30,70), dir: Math.random()<0.5?-1:1 };
}
function ambientFishLoop(fishes, ref, now){
  if(!ref.alive) return;
  const dt = ref.last ? (now-ref.last)/1000 : 0.016; ref.last = now;
  if(!paused) fishes.forEach(f=> stepAmbientFish(f, dt));
  requestAnimationFrame(t=> ambientFishLoop(fishes, ref, t));
}
function stepAmbientFish(f, dt){
  f.x += f.dir*f.speed*dt;
  if(f.x <= 0){ f.x = 0; f.dir = 1; }
  if(f.x+f.w >= STAGE_W){ f.x = STAGE_W-f.w; f.dir = -1; }
  f.el.style.left = f.x+'px';
  f.el.style.transform = `scaleX(${f.dir})`;
}
function scheduleAmbientTrash(ref){
  if(!ref.alive) return;
  if(!paused) spawnAmbientTrash(ref);
  timers.push(setTimeout(()=> scheduleAmbientTrash(ref), 5000));
}
function spawnAmbientTrash(ref){
  const name = trashNames[Math.floor(Math.random()*trashNames.length)];
  const src = IMG+name;
  const el = makeImg(src);
  const scale = randRange(0.7, 1.3), angle = randRange(0,360);
  const d = dims(src);
  const w = d.w*scale, h = d.h*scale;
  el.style.width = w+'px'; el.style.height = h+'px';
  el.style.transform = `rotate(${angle}deg)`;
  const data = { el, x: randRange(0, STAGE_W-w), y:-h, vy: randRange(100,180) };
  el.style.left = data.x+'px'; el.style.top = data.y+'px';
  requestAnimationFrame(t=> fallAmbientTrash(data, ref, t));
}
function fallAmbientTrash(data, ref, now){
  if(!ref.alive){ data.el.remove(); return; }
  const dt = data.last ? (now-data.last)/1000 : 0.016; data.last = now;
  if(!paused){
    data.y += data.vy*dt;
    data.el.style.top = data.y+'px';
    if(data.y > STAGE_H){ dissolveAmbientTrash(data.el); return; }
  }
  requestAnimationFrame(t=> fallAmbientTrash(data, ref, t));
}
function dissolveAmbientTrash(el){
  el.style.transition = 'opacity .6s ease';
  el.style.opacity = '0';
  setTimeout(()=> el.remove(), 650);
}

// ---------------- 2. random_char_01 -> 02 -> slot machine ----------------
function showRandomize(){
  currentScene = 'randomize';
  clearStage();
  makeImg(IMG+'random_char_01.png','layer');
  const mystery = makeImg(IMG+'fish_mystery.png');
  fitSlotFish(mystery, IMG+'fish_mystery.png');
  timers.push(setTimeout(()=> startCharTwo(mystery), 1500));
}
function startCharTwo(mystery){
  mystery.remove();
  const bg = stage.querySelector('.layer');
  bg.src = IMG+'random_char_02.png';
  const src0 = IMG+fishNames[0];
  const el = makeImg(src0);
  fitSlotFish(el, src0);
  runSlotMachine(el, 0, 28, Math.floor(Math.random()*fishNames.length));
}
function fitSlotFish(el, src){
  const d = dims(src);
  const { w, h } = fitBox(d.w, d.h, RANDOMIZE_BOX.w, RANDOMIZE_BOX.h);
  el.style.width = w+'px'; el.style.height = h+'px';
  el.style.left = RANDOMIZE_BOX.left + (RANDOMIZE_BOX.w-w)/2 + 'px';
  el.style.top  = RANDOMIZE_BOX.top  + (RANDOMIZE_BOX.h-h)/2 + 'px';
}
function runSlotMachine(el, ticks, total, chosenIndex){
  if(paused){ timers.push(setTimeout(()=>runSlotMachine(el, ticks, total, chosenIndex), 200)); return; }
  const src = IMG + fishNames[Math.floor(Math.random()*fishNames.length)];
  el.src = src; fitSlotFish(el, src);
  if(ticks+1 < total){
    const delay = 40 + Math.pow((ticks+1)/total, 2)*360;
    timers.push(setTimeout(()=>runSlotMachine(el, ticks+1, total, chosenIndex), delay));
  } else finishSlot(el, chosenIndex);
}
function finishSlot(el, chosenIndex){
  const src = IMG + fishNames[chosenIndex];
  el.src = src;
  fitSlotFish(el, src);
  showClickToContinue();
  stage.onclick = ()=> {
    playSound(sounds.clicking, 'clicking');
    showGamePhase(src);
  };
}
function showClickToContinue(){
  const el = document.createElement('div');
  el.className = 'clicktocontinue';
  el.textContent = 'click to continue';
  stage.appendChild(el);
}

// ---------------- 3. main game phase ----------------
function showGamePhase(src){
  currentScene = 'game';
  clearStage();
  const bg = makeImg(IMG+'game_background.png','layer');
  const state = { alive:true, bg, src };
  cleanupFns.push(()=> state.alive=false);
  const fish = createSwimFish(src, state);
  timers.push(setTimeout(()=> showPopup(state, fish), 2000));
}
function createSwimFish(src, state){
  const el = makeImg(src);
  const fish = { el, w:0, h:0, x:0, y:0, tx:0, ty:0, facing:1 };
  const scale = randRange(0.67, 1.5);
  const d = dims(src);
  fish.w = d.w*scale; fish.h = d.h*scale;
  el.style.width = fish.w+'px'; el.style.height = fish.h+'px';
  placeInSwimBox(fish);
  pickSwimTarget(fish);
  requestAnimationFrame(t=> stepFish(fish, state, t));
  return fish;
}
function placeInSwimBox(fish){
  fish.x = randRange(SWIM_BOX.left, SWIM_BOX.right - fish.w);
  fish.y = randRange(SWIM_BOX.top, SWIM_BOX.bottom - fish.h);
}
function pickSwimTarget(fish){
  fish.tx = randRange(SWIM_BOX.left, SWIM_BOX.right - fish.w);
  fish.ty = randRange(SWIM_BOX.top, SWIM_BOX.bottom - fish.h);
}
function stepFish(fish, state, now){
  if(!state.alive) return;
  const dt = fish.last ? (now-fish.last)/1000 : 0.016; fish.last = now;
  if(!paused) moveTowardTarget(fish, dt);
  fish.el.style.left = fish.x+'px'; fish.el.style.top = fish.y+'px';
  fish.el.style.transform = `scaleX(${fish.facing})`;
  requestAnimationFrame(t=> stepFish(fish, state, t));
}
function moveTowardTarget(fish, dt){
  const dx = fish.tx-fish.x, dy = fish.ty-fish.y, dist = Math.hypot(dx,dy);
  if(dist < 6){ pickSwimTarget(fish); return; }
  fish.x += (dx/dist)*FISH_SPEED*dt;
  fish.y += (dy/dist)*FISH_SPEED*dt;
  fish.facing = dx >= 0 ? 1 : -1;
}

// ---------------- instruction popup ----------------
function showPopup(state, fish){
  const popup = makeImg(IMG+'instruction_pop-up.png','layer');
  popup.style.zIndex = 100;
  stage.onclick = ()=>{
    playSound(sounds.clicking, 'clicking');
    popup.remove();
    stage.onclick = null;
    beginTrashChallenge(state, fish);
  };
}

// ---------------- trash challenge ----------------
function beginTrashChallenge(state, fish){
  const ch = { missCount:0, spawning:true, ended:false, active:new Set(), timeLeft:30, fish, state };
  hud.style.display = 'block';
  updateHud(ch);
  ch.countdown = setInterval(()=> tickCountdown(ch), 1000);
  intervals.push(ch.countdown);
  spawnLoop(ch);
  requestAnimationFrame(t=> trashLoop(ch, t));
}
function heartSVG(filled){
  const fill = filled ? '#ff4d6d' : 'none';
  return `<svg viewBox="0 0 24 24" width="34" height="34"><path d="M12 21s-6.7-4.35-9.3-8.28C.9 9.86 1.9 6 5.4 5.1 7.9 4.45 10 6 12 8.2 14 6 16.1 4.45 18.6 5.1c3.5.9 4.5 4.76 2.7 7.62C18.7 16.65 12 21 12 21z" fill="${fill}" stroke="#ff4d6d" stroke-width="2"/></svg>`;
}
function updateHud(ch){
  hudTimer.textContent = Math.max(ch.timeLeft, 0);
  hudHearts.innerHTML = Array.from({length: MAX_MISSES}, (_,i)=> heartSVG(i >= ch.missCount)).join('');
}
function tickCountdown(ch){
  if(paused) return;
  ch.timeLeft--; updateHud(ch);
  if(ch.timeLeft <= 0){ ch.spawning=false; clearInterval(ch.countdown); checkEnd(ch); }
}
function spawnLoop(ch){
  if(!ch.spawning || ch.ended) return;
  if(paused){ timers.push(setTimeout(()=> spawnLoop(ch), 300)); return; }
  const frac = 1 - Math.max(ch.timeLeft,0)/30;
  const count = 1 + Math.floor(frac*2);
  for(let i=0;i<count;i++) spawnTrashPiece(ch);
  timers.push(setTimeout(()=> spawnLoop(ch), 1800 - 1600*frac*frac));
}
function spawnTrashPiece(ch){
  const name = trashNames[Math.floor(Math.random()*trashNames.length)];
  const el = makeImg(IMG+name);
  const data = makeTrashData(el, IMG+name);
  el.addEventListener('click', e=> onTrashClick(e, ch, data));
  ch.active.add(data);
}
function makeTrashData(el, src){
  const scale = randRange(0.5, 2), angle = randRange(0, 360);
  const d = dims(src);
  const data = { el, w:d.w*scale, h:d.h*scale, y:-160, angle, vy:randRange(140,260) };
  el.style.width = data.w+'px'; el.style.height = data.h+'px';
  el.style.transform = `rotate(${angle}deg)`;
  const { minX, maxX } = rotatedXBounds(data.w, rotatedBox(data.w, data.h, angle).bbW);
  Object.assign(data, { minX, maxX, x: randRange(minX,maxX), vx: randRange(-40,40) });
  el.style.left = data.x+'px'; el.style.top = data.y+'px';
  return data;
}
function onTrashClick(e, ch, data){
  e.stopPropagation();
  if(data.el.dataset.state === 'missed') return;
  playSound(sounds.clickingTrash, 'clickingTrash');
  data.el.remove();
  ch.active.delete(data);
  checkEnd(ch);
}
function trashLoop(ch, now){
  if(!ch.state.alive || ch.ended) return;
  const dt = ch.tLast ? (now-ch.tLast)/1000 : 0.016; ch.tLast = now;
  if(!paused) ch.active.forEach(d=> stepTrash(d, ch, dt));
  requestAnimationFrame(t=> trashLoop(ch, t));
}
function stepTrash(d, ch, dt){
  d.x += d.vx*dt; d.y += d.vy*dt;
  if(d.x < d.minX || d.x > d.maxX) d.vx *= -1;
  d.x = Math.max(d.minX, Math.min(d.maxX, d.x));
  d.el.style.left = d.x+'px'; d.el.style.top = d.y+'px';
  if(d.y > STAGE_H) handleMiss(d, ch);
}
function handleMiss(d, ch){
  d.el.dataset.state = 'missed';
  d.el.remove();
  ch.active.delete(d);
  playSound(sounds.wrong, 'wrong');
  ch.missCount++;
  if(ch.missCount >= MAX_MISSES){ triggerLose(ch); return; }
  triggerWarning();
  updateHud(ch);
  checkEnd(ch);
}
function checkEnd(ch){
  if(ch.ended) return;
  if(!ch.spawning && ch.active.size === 0){
    ch.ended = true; clearInterval(ch.countdown);
    if(ch.missCount <= MAX_MISSES) triggerWin(ch);
  }
}

// ---------------- lose scene ----------------
function triggerLose(ch){
  if(ch.ended) return;
  currentScene = 'lose';
  ch.ended = true;
  ch.spawning = false;
  clearInterval(ch.countdown);
  hud.style.display = 'none';
  if(warningEl){ warningEl.style.display = 'none'; clearTimeout(warningTimer); }
  ch.state.alive = false;
  const leftover = [...ch.active];
  leftover.forEach(d=> d.el.style.display = 'none');
  ch.fish.el.remove();
  const losePopup = makeImg(IMG+'lose.png','layer');
  losePopup.style.zIndex = 495; // above the warning flash (490), below the menu bar (500)
  stopBackgroundMusic();
  playSound(sounds.youLose, 'youLose');
  timers.push(setTimeout(()=>{
    losePopup.remove();
    stopSound(sounds.youLose);
    resumeBackgroundMusic();
    enterLoseScene(ch, leftover);
  }, 5000));
}
function enterLoseScene(ch, leftover){
  ch.state.bg.src = IMG+'game_background_lose.png';
  const target = Math.floor(randRange(10, 18));
  const kept = leftover.slice(0, target);
  leftover.slice(target).forEach(d=> d.el.remove());
  const filler = Array.from({length: Math.max(0, target-kept.length)}, makeFillerPiece);
  const deadFish = pickDeadFishScales().map(makeDeadFishPiece);
  startFloatingTrash([...kept, ...filler, ...deadFish]);
}
function makeFillerPiece(){
  const name = trashNames[Math.floor(Math.random()*trashNames.length)];
  const el = makeImg(IMG+name);
  return { el, src: IMG+name, scale: randRange(0.5, 1.6), angle: randRange(0, 360) };
}
function makeDeadFishPiece(scale){
  const el = makeImg(IMG+FISH_DEAD);
  return { el, src: IMG+FISH_DEAD, scale, angle: 180 };
}
// 1-3 dead fish, sizes drawn without repeats from {full, 75%, 50%} so none match or sit near-identical
const DEAD_FISH_SCALES = [1, 0.75, 0.5];
function pickDeadFishScales(){
  const count = 1 + Math.floor(Math.random()*3);
  return [...DEAD_FISH_SCALES].sort(()=> Math.random()-0.5).slice(0, count);
}
function startFloatingTrash(items){
  const ref = { alive:true };
  cleanupFns.push(()=> ref.alive = false);
  const floaters = items.map(makeFloater);
  requestAnimationFrame(t=> floatLoop(floaters, ref, t));
}
function makeFloater(item){
  const el = item.el;
  el.style.display = '';
  const w = item.scale != null ? dims(item.src).w*item.scale : item.w;
  const h = item.scale != null ? dims(item.src).h*item.scale : item.h;
  el.style.width = w+'px'; el.style.height = h+'px';
  el.style.transform = `rotate(${item.angle}deg)`;
  el.style.pointerEvents = 'none';
  return finishFloater(el, w, h, item.angle);
}
function finishFloater(el, w, h, angle){
  const { bbW, bbH } = rotatedBox(w, h, angle);
  const bounds = { ...rotatedXBounds(w, bbW), ...rotatedYBounds(h, bbH) };
  bounds.minY = Math.max(bounds.minY, MENU_BAR_HEIGHT);
  const pos = randomSafeSpot(w, h, bounds);
  el.style.left = pos.x+'px'; el.style.top = pos.y+'px';
  return { el, bounds, baseX:pos.x, baseY:pos.y, phase:randRange(0,Math.PI*2), amp:randRange(6,12), speed:randRange(0.3,0.7) };
}
function randomSafeSpot(w, h, bounds){
  let x, y, tries = 0;
  do{ x = randRange(bounds.minX, bounds.maxX); y = randRange(bounds.minY, bounds.maxY); tries++; }
  while(overlapsCoral(x,y,w,h) && tries < 30);
  return { x, y };
}
function floatLoop(floaters, ref, now){
  if(!ref.alive) return;
  if(!ref.start) ref.start = now;
  if(paused){ ref.pauseStart = ref.pauseStart || now; requestAnimationFrame(n=> floatLoop(floaters, ref, n)); return; }
  if(ref.pauseStart){ ref.start += (now - ref.pauseStart); ref.pauseStart = null; }
  const t = (now-ref.start)/1000;
  floaters.forEach(f=> updateFloater(f, t));
  requestAnimationFrame(n=> floatLoop(floaters, ref, n));
}
function updateFloater(f, t){
  const x = f.baseX + Math.sin(t*f.speed+f.phase)*f.amp;
  const y = f.baseY + Math.cos(t*f.speed*0.8+f.phase)*f.amp;
  f.el.style.left = Math.max(f.bounds.minX, Math.min(f.bounds.maxX, x))+'px';
  f.el.style.top  = Math.max(f.bounds.minY, Math.min(f.bounds.maxY, y))+'px';
}

// ---------------- win scene ----------------
function triggerWin(ch){
  currentScene = 'win';
  ch.active.forEach(d=> d.el.remove());
  ch.active.clear();
  hud.style.display = 'none';
  if(warningEl){ warningEl.style.display = 'none'; clearTimeout(warningTimer); }
  ch.state.alive = false;
  ch.fish.el.remove();
  const winPopup = makeImg(IMG+'win.png','layer');
  winPopup.style.zIndex = 495; // above the warning flash (490), below the menu bar (500)
  stopBackgroundMusic();
  playSound(sounds.youWin, 'youWin');
  timers.push(setTimeout(()=>{
    winPopup.remove();
    ch.state.bg.src = IMG+'game_background_win.png';
    stopSound(sounds.youWin);
    resumeBackgroundMusic();
    spawnWinFish(ch.state.src);
  }, 5000));
}

function spawnWinFish(src){
  const count = 5 + Math.floor(Math.random() * 4);
  const scales = winFishScales(count);
  const bandYs = winFishBands(count);
  const fishes = [];
  for(let i = 0; i < count; i++){
    fishes.push(makeWinFish(src, scales[i], bandYs[i], fishes));
  }
  const ref = { alive:true, last:null, start:null };
  cleanupFns.push(() => { ref.alive = false; });
  requestAnimationFrame(t => winLoop(fishes, ref, t));
}
// spread sizes across a moderate range, forced apart so no two fish are the same size (or close to it)
function winFishScales(count){
  const minGap = 0.08;
  let arr = [];
  for(let i=0;i<count;i++){
    const t = count>1 ? i/(count-1) : 0.5;
    arr.push(0.55 + t*(1.1-0.55) + randRange(-0.02,0.02));
  }
  arr.sort((a,b)=> a-b);
  for(let i=1;i<arr.length;i++){
    if(arr[i]-arr[i-1] < minGap) arr[i] = arr[i-1]+minGap;
  }
  return arr.sort(()=> Math.random()-0.5);
}
// one target row per fish, spread across the safe vertical range
function winFishBands(count){
  const top = MENU_BAR_HEIGHT+20, bottom = CORAL_RECTS[0].y-20;
  const bandH = (bottom-top)/count;
  const arr = [];
  for(let i=0;i<count;i++) arr.push(top + i*bandH + bandH/2);
  return arr.sort(()=> Math.random()-0.5);
}

function makeWinFish(src, scale, targetY, existing){
  const el = makeImg(src);
  const d = dims(src);
  const w = d.w * scale, h = d.h * scale;
  el.style.width = w + 'px';
  el.style.height = h + 'px';
  const pos = safeWinFishSpot(w, h, targetY, existing);
  el.style.left = pos.x + 'px';
  el.style.top = pos.y + 'px';
  return {
    el, x: pos.x, baseY: pos.y, w, h,
    speed: randRange(60, 160),
    dir: Math.random() < 0.5 ? -1 : 1,
    bobAmp: randRange(8, 20),
    bobSpeed: randRange(1, 2.2),
    bobPhase: randRange(0, Math.PI*2),
    spinTimer: randRange(3, 7),
    spinT: 0, spinning: false, spinAngle: 0
  };
}
function safeWinFishSpot(w, h, targetY, existing){
  const minY = MENU_BAR_HEIGHT+20, maxY = Math.max(minY, CORAL_RECTS[0].y - h - 20);
  let x, y, tries = 0, bad = true;
  while(bad && tries < 60){
    x = randRange(0, STAGE_W-w);
    const jitter = tries < 30 ? randRange(-60,60) : randRange(-200,200);
    y = Math.max(minY, Math.min(maxY, targetY - h/2 + jitter));
    bad = existing.some(f=> x < f.x+f.w && x+w > f.x && y < f.baseY+f.h && y+h > f.baseY);
    tries++;
  }
  return { x, y };
}

function winLoop(fishes, ref, now){
  if(!ref.alive) return;
  const dt = ref.last ? Math.min((now - ref.last) / 1000, 0.033) : 0.016;
  ref.last = now;
  if(!ref.start) ref.start = now;
  const t = (now - ref.start) / 1000;
  if(!paused) fishes.forEach(f => stepWinFish(f, dt, t));
  fishes.forEach(renderFish);
  requestAnimationFrame(nt => winLoop(fishes, ref, nt));
}
function stepWinFish(f, dt, t){
  f.x += f.dir * f.speed * dt;
  if(f.x <= 0){ f.x = 0; f.dir = 1; }
  if(f.x + f.w >= STAGE_W){ f.x = STAGE_W - f.w; f.dir = -1; }
  f.y = f.baseY + Math.sin(t*f.bobSpeed + f.bobPhase) * f.bobAmp;
  updateSpin(f, dt);
}
function updateSpin(f, dt){
  if(f.spinning){
    f.spinT += dt;
    f.spinAngle = Math.min(1, f.spinT/0.6) * 360;
    if(f.spinT >= 0.6){ f.spinning = false; f.spinAngle = 0; f.spinTimer = randRange(3, 7); }
    return;
  }
  f.spinTimer -= dt;
  if(f.spinTimer <= 0){ f.spinning = true; f.spinT = 0; }
}

function renderFish(f){
  f.el.style.left = f.x + 'px';
  f.el.style.top = f.y + 'px';
  const spin = f.spinAngle ? ` rotate(${f.dir*f.spinAngle}deg)` : '';
  f.el.style.transform = `scaleX(${f.dir})${spin}`;
}

// ---------------- boot ----------------
const ALL_ASSETS = [
  'game_start.png','home.png','menu_bar.png','menu_drop_down.png','credit.png',
  'random_char_01.png','random_char_02.png',
  'game_background.png','game_background_lose.png','lose.png',
  'instruction_pop-up.png','win.png','game_background_win.png', FISH_DEAD, 'fish_mystery.png',
  ...fishNames, ...trashNames, ...warningNames
].map(n=> IMG+n);

fitStage();
preload(ALL_ASSETS).then(()=>{
  const l = document.getElementById('loading');
  if(l) l.remove();
  showStart();
});
</script>
